name: Validate patch bundle

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Package credentials are only available to branches in this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Test and build review bundle
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: |
          test -n "$GITHUB_TOKEN" || { echo 'MORPHE_PACKAGES_TOKEN is required for the Morphe registry.'; exit 1; }
          bash gradlew --build-cache -Pversion=0.0.0-review \
            :extensions:extension:testDebugUnitTest :extensions:calculator:testDebugUnitTest \
            :patches:check :patches:buildAndroid :patches:verifyReleaseBundleImport
      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: patches-review-${{ github.sha }}
          path: patches/build/libs/*.mpp
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            extensions/*/build/reports/tests/
            patches/build/reports/tests/
          if-no-files-found: ignore

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">GboardPatches Community</title>
  <desc id="desc">Community-maintained Morphe patches for Gboard, with a translucent keyboard illustration and blue-violet gradient.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1e"/>
      <stop offset="0.55" stop-color="#111b36"/>
      <stop offset="1" stop-color="#0c1430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71d9ff"/>
      <stop offset="0.55" stop-color="#9f9cff"/>
      <stop offset="1" stop-color="#c19aff"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e6ff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#778dd3" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#658cff" stop-opacity=".40"/>
      <stop offset="1" stop-color="#658cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <g id="keycap">
      <rect width="72" height="58" rx="15" fill="url(#key)" stroke="#bdd2ff" stroke-opacity=".24"/>
      <path d="M13 9h46" fill="none" stroke="#f6fbff" stroke-opacity=".17" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="500" rx="32" fill="url(#background)"/>
  <circle cx="1300" cy="246" r="360" fill="url(#halo)"/>
  <circle cx="340" cy="34" r="230" fill="#516df4" opacity=".08" filter="url(#glow)"/>
  <path d="M0 398C270 300 472 486 776 379S1236 318 1600 422" fill="none" stroke="#7d91f7" stroke-opacity=".12" stroke-width="2"/>
  <path d="M0 420C284 318 492 506 794 401S1238 335 1600 449" fill="none" stroke="#a5d8ff" stroke-opacity=".10" stroke-width="2"/>

  <g transform="translate(75 88)">
    <rect width="70" height="70" rx="19" fill="url(#accent)" opacity=".95"/>
    <rect x="14" y="16" width="42" height="39" rx="8" fill="#152044"/>
    <g fill="#dff7ff">
      <rect x="20" y="22" width="8" height="7" rx="2"/>
      <rect x="31" y="22" width="8" height="7" rx="2"/>
      <rect x="42" y="22" width="8" height="7" rx="2"/>
      <rect x="20" y="32" width="8" height="7" rx="2"/>
      <rect x="31" y="32" width="8" height="7" rx="2"/>
      <rect x="42" y="32" width="8" height="7" rx="2"/>
      <rect x="22" y="43" width="26" height="6" rx="3"/>
    </g>
    <text x="88" y="29" fill="#b4c6f4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">THE COMMUNITY FORK</text>
  </g>

  <text x="77" y="258" fill="#f7faff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="73" font-weight="800" letter-spacing="-3">GboardPatches</text>
  <text x="81" y="334" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="73" font-weight="800" letter-spacing="-3">Community</text>
  <text x="81" y="391" fill="#acbddf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Your keyboard. Your shortcuts. Your workflow.</text>
  <g transform="translate(80 435)">
    <circle cx="7" cy="7" r="6" fill="#80e7ce"/>
    <text x="24" y="13" fill="#9fb2d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="1.5">OPEN SOURCE  ·  MORPHE PATCHES  ·  BUILT FOR GBOARD</text>
  </g>

  <g transform="translate(912 77) rotate(-8 300 180)">
    <rect x="-20" y="-17" width="626" height="367" rx="39" fill="#92a8ff" opacity=".11" filter="url(#glow)"/>
    <rect width="608" height="345" rx="34" fill="#cedaff" fill-opacity=".085" stroke="#c5d8ff" stroke-opacity=".32" stroke-width="2"/>
    <path d="M36 22h536" stroke="#e8f3ff" stroke-opacity=".21" stroke-linecap="round"/>
    <g transform="translate(31 38)" fill="#edf6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle">
      <use href="#keycap" x="0" y="0"/><text x="36" y="37">Q</text>
      <use href="#keycap" x="91" y="0"/><text x="127" y="37">W</text>
      <use href="#keycap" x="182" y="0"/><text x="218" y="37">E</text>
      <use href="#keycap" x="273" y="0"/><text x="309" y="37">R</text>
      <use href="#keycap" x="364" y="0"/><text x="400" y="37">T</text>
      <use href="#keycap" x="455" y="0"/><text x="491" y="37">Y</text>
      <use href="#keycap" x="35" y="76"/><text x="71" y="113">A</text>
      <use href="#keycap" x="126" y="76"/><text x="162" y="113">S</text>
      <use href="#keycap" x="217" y="76"/><text x="253" y="113">D</text>
      <use href="#keycap" x="308" y="76"/><text x="344" y="113">F</text>
      <use href="#keycap" x="399" y="76"/><text x="435" y="113">G</text>
      <rect x="0" y="153" width="165" height="58" rx="15" fill="#8eacff" fill-opacity=".26" stroke="#b9cfff" stroke-opacity=".38"/>
      <text x="82" y="190" font-size="19">↶  Undo</text>
      <rect x="183" y="153" width="165" height="58" rx="15" fill="#8eacff" fill-opacity=".26" stroke="#b9cfff" stroke-opacity=".38"/>
      <text x="265" y="190" font-size="19">Redo  ↷</text>
      <rect x="366" y="153" width="161" height="58" rx="15" fill="#8be6dc" fill-opacity=".19" stroke="#9bf5e6" stroke-opacity=".49"/>
      <text x="446" y="190" font-size="19">⌕  Search</text>
      <rect x="96" y="229" width="358" height="43" rx="14" fill="url(#key)" stroke="#bdd2ff" stroke-opacity=".24"/>
      <text x="275" y="258" font-size="16" fill="#b7cafa">GboardPatches Community</text>
    </g>
  </g>
  <rect x="1" y="1" width="1598" height="498" rx="31" fill="none" stroke="#d3e5ff" stroke-opacity=".15" stroke-width="2"/>
</svg>
